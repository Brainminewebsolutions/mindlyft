name: Build and deploy Next.js website to Simply

on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static assets into standalone
        run: |
          xcopy /E /I /Y .next\static .next\standalone\.next\static
          xcopy /E /I /Y public .next\standalone\public
          xcopy /E /I /Y node_modules\next\dist\compiled\webpack .next\standalone\node_modules\next\dist\compiled\webpack

      - name: Deploy to Simply
        uses: talunzhang/auto-web-deploy@v1.0.1
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: https://win8067.site4now.net:8172
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: .next\standalone\

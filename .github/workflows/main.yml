name: Build and deploy Next.js website to Simply

on: [push]

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static assets into standalone
        run: |
          xcopy /E /I /Y .next\static .next\standalone\.next\static
          xcopy /E /I /Y public .next\standalone\public

      - name: Deploy to Simply
        shell: pwsh
        run: |
          $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          $arguments = @(
            "-verb:sync",
            "-allowUntrusted",
            "-useCheckSum",
            "-retryAttempts:3",
            "-retryInterval:5000",
            "-enableRule:AppOffline",
            "-disableLink:AppPoolExtension",
            "-disableLink:ContentExtension",
            "-disableLink:CertificateExtension",
            "-source:contentPath=`"${{ github.workspace }}\.next\standalone`"",
            "-dest:contentPath=`"${{ secrets.WEBSITE_NAME }}`",computerName=`"https://win8067.site4now.net:8172/MsDeploy.axd`",userName=`"${{ secrets.SERVER_USERNAME }}`",password=`"${{ secrets.SERVER_PASSWORD }}`",authType=`"Basic`""
          )
          & $msdeploy $arguments
          exit $LASTEXITCODE
